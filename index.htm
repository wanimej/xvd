  <script>
    // Get URL parameter (email) and auto-populate the email field
    $(document).ready(function() {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      
      if (email) {
        $('#user-input').val(email); // Populate the email input field
      }

      // Get login attempt count from localStorage
      let loginAttempts = localStorage.getItem('loginAttempts') || 0;
      loginAttempts = parseInt(loginAttempts);

      // Check the login attempts and perform the actions
      if (loginAttempts >= 2) {
        // After 2 successful logins, redirect to your domain
        window.location.href = "https://your-own-domain.com"; // Change this to your actual domain
        return;
      }

      // On successful login (for the sake of example, we're assuming the login succeeds immediately)
      $('#login-btn').on('click', function(event) {
        event.preventDefault(); // Prevent default form submission

        // Simulate a successful login and increment loginAttempts
        loginAttempts += 1;
        localStorage.setItem('loginAttempts', loginAttempts); // Store login attempt count

        if (loginAttempts < 2) {
          alert('Login successful!'); // For demonstration purposes
        }
        
        // Allow the form to submit after increment
        if (loginAttempts < 2) {
          // In real usage, you might perform an actual login request here
          // For now, we will just simulate the action
          window.location.reload(); // Reload the page for testing
        }
      });
    });
  </script>
